<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Islamic Minimal Live Wallpaper</title>
  
  <!-- Nastaliq for main calligraphy & Amiri / Cinzel for verses & clock -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,400;0,700;1,400&family=Cinzel:wght@400;600&family=Noto+Nastaliq+Urdu:wght@500;700&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #0b0706;
      font-family: 'Amiri', serif;
    }

    /* Background image layer */
    .bg-container {
      position: absolute;
      inset: 0;
      background: url('bg.jpg') no-repeat center center;
      background-size: cover;
      z-index: 1;
    }



    /* Central Content Box */
    .content-wrapper {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 10;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      width: 90%;
      max-width: 950px;
      pointer-events: none;
    }

    /* Main Calligraphy - Nastaliq Urdu (Crisp White) */
    .main-word {
      font-family: 'Noto Nastaliq Urdu', serif;
      font-size: clamp(6.5rem, 14vw, 11rem);
      font-weight: 700;
      line-height: 1.4;
      color: #ffffff;
      text-shadow: 0 4px 20px rgba(0, 0, 0, 0.85), 0 0 10px rgba(0, 0, 0, 0.5);
      padding: 0 20px;
      margin-bottom: -15px;
    }
    
    /* Ink Reveal / Dissolve Transitions */
    .ink-draw-in {
      animation: inkReveal var(--trans-speed, 1.8s) cubic-bezier(0.2, 0.8, 0.25, 1) forwards;
    }

    .ink-fade-out {
      animation: inkDissolve var(--trans-speed, 1.8s) cubic-bezier(0.5, 0, 0.75, 0) forwards;
    }

    @keyframes inkReveal {
      0% {
        opacity: 0;
        filter: blur(10px);
        transform: scale(0.95) translateY(8px);
      }
      100% {
        opacity: 1;
        filter: blur(0px);
        transform: scale(1) translateY(0);
      }
    }

    @keyframes inkDissolve {
      0% {
        opacity: 1;
        filter: blur(0px);
        transform: scale(1);
      }
      100% {
        opacity: 0;
        filter: blur(12px);
        transform: scale(1.03) translateY(-6px);
      }
    }

    /* Divider */
    .divider {
      width: 120px;
      height: 1.5px;
      background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.6), transparent);
      margin: 70px 0 18px 0;
      opacity: 0;
      transition: opacity var(--trans-speed, 1.8s) ease;
    }
    .divider.show {
      opacity: 0;
    }

    /* Verse Box */
    .verse-container {
      display: flex;
      flex-direction: column;
      gap: 6px;
      opacity: 0;
      transform: translateY(8px);
      transition: opacity var(--trans-speed, 1.8s) ease, transform var(--trans-speed, 1.8s) ease;
    }

    .verse-container.show {
      opacity: 1;
      transform: translateY(0);
    }

    .arabic-verse {
      font-family: 'Amiri', serif;
      font-size: clamp(1.4rem, 2.5vw, 2.2rem);
      font-weight: 700;
      color: #ffffff;
      direction: rtl;
      line-height: 1.6;
      text-shadow: 0 2px 14px rgba(0, 0, 0, 0.95);
    }

    .translation {
      font-family: 'Cinzel', serif;
      font-size: clamp(0.85rem, 1.2vw, 1.1rem);
      letter-spacing: 1.2px;
      color: #e5ded2;
      text-shadow: 0 2px 10px rgba(0, 0, 0, 0.9);
      direction: ltr;
    }

    .reference {
      font-family: 'Cinzel', serif;
      font-size: 0.75rem;
      letter-spacing: 2px;
      color: #c9bcab;
      margin-top: 2px;
      opacity: 0.9;
      direction: ltr;
    }

    /* Controls Panel - Top Right Corner */
    .controls-panel {
      position: absolute;
      top: 20px;
      right: 20px;
      background: rgba(20, 16, 15, 0.7);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 12px;
      padding: 12px 16px;
      color: #f0eae1;
      font-family: sans-serif;
      font-size: 12px;
      z-index: 100;
      display: flex;
      flex-direction: column;
      gap: 10px;
      opacity: 0;
      transition: opacity 0.3s ease;
      direction: ltr;
    }

    .controls-panel:hover, .controls-panel:focus-within {
      opacity: 1;
    }

    .control-group {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
    }

    .control-group label {
      font-size: 11px;
      letter-spacing: 0.5px;
      white-space: nowrap;
    }

    .control-group input[type="range"] {
      width: 90px;
      accent-color: #d1b89d;
    }

    .hint-tag {
      position: absolute;
      top: 20px;
      right: 20px;
      color: rgba(255, 255, 255, 0.3);
      font-size: 11px;
      font-family: sans-serif;
      z-index: 99;
      pointer-events: none;
      direction: ltr;
    }


  </style>
</head>
<body>

  <div class="bg-container"></div>
  <div class="vignette"></div>


  <div class="hint-tag">⚙ Hover here for settings</div>

  <!-- Settings in Top-Right -->
  <div class="controls-panel">
    <div class="control-group">
      <label>Display Time: <span id="val-display">8</span>s</label>
      <input type="range" id="input-display" min="4" max="30" value="8" step="1">
    </div>
    <div class="control-group">
      <label>Transition: <span id="val-trans">1.8</span>s</label>
      <input type="range" id="input-trans" min="0.6" max="3.5" value="1.8" step="0.1">
    </div>
  </div>

  <!-- Centered Content -->
  <div class="content-wrapper">
    <div id="word-elem" class="main-word">توکل</div>
    <div id="divider-elem" class="divider"></div>
    <div id="verse-box" class="verse-container">
      <div id="verse-arabic" class="arabic-verse">وَمَن يَتَوَكَّلْ عَلَى اللَّهِ فَهُوَ حَسْبُهُ</div>
      <div id="verse-trans" class="translation">"And whoever relies upon Allah – then He is sufficient for him."</div>
      <div id="verse-ref" class="reference">SURAH AT-TALAQ : 3</div>
    </div>
  </div>

  <script>
    // Spiritual Words & Quranic Verses
    const spiritualList = [
      {
        word: "توکل",
        verse: "« وَمَن يَتَوَكَّلْ عَلَى اللَّهِ فَهُوَ حَسْبُهُ »",
        trans: '"And whoever relies upon Allah – then He is sufficient for him."',
        ref: "SURAH AT-TALAQ : 3"
      },
      {
        word: "صبر",
        verse: "« إِنَّ اللَّهَ مَعَ الصَّابِرِينَ »",
        trans: '"Indeed, Allah is with those who are patient."',
        ref: "SURAH AL-BAQARAH : 153"
      },
      {
        word: "شکر",
        verse: "« لَئِن شَكَرْتُمْ لَأَزِيدَنَّكُمْ »",
        trans: '"If you are grateful, I will surely increase your favor."',
        ref: "SURAH IBRAHIM : 7"
      },
      {
        word: "رضا",
        verse: "« رَّضِيَ اللَّهُ عَنْهُمْ وَرَضُوا عَنْهُ »",
        trans: '"Allah is pleased with them, and they are pleased with Him."',
        ref: "SURAH AL-BAYYINAH : 8"
      },
      {
        word: "دعا",
        verse: "« وَقَالَ رَبُّكُمُ ادْعُونِي أَسْتَجِبْ لَكُمْ »",
        trans: '"And your Lord says: Call upon Me; I will respond to you."',
        ref: "SURAH GHAFIR : 60"
      }
    ];

    let currentIndex = 0;
    let displayDuration = 8000;
    let transitionDuration = 1800;
    let cycleTimer = null;

    const wordElem = document.getElementById('word-elem');
    const dividerElem = document.getElementById('divider-elem');
    const verseBox = document.getElementById('verse-box');
    const verseArabic = document.getElementById('verse-arabic');
    const verseTrans = document.getElementById('verse-trans');
    const verseRef = document.getElementById('verse-ref');

    // Controls
    const inputDisplay = document.getElementById('input-display');
    const inputTrans = document.getElementById('input-trans');
    const valDisplay = document.getElementById('val-display');
    const valTrans = document.getElementById('val-trans');

    function updateTimingVariables() {
      document.documentElement.style.setProperty('--trans-speed', `${transitionDuration / 1000}s`);
    }

    inputDisplay.addEventListener('input', (e) => {
      displayDuration = parseFloat(e.target.value) * 1000;
      valDisplay.textContent = e.target.value;
      restartCycle();
    });

    inputTrans.addEventListener('input', (e) => {
      transitionDuration = parseFloat(e.target.value) * 1000;
      valTrans.textContent = e.target.value;
      updateTimingVariables();
      restartCycle();
    });

    function showItem(index) {
      const data = spiritualList[index];

      // Update text
      wordElem.textContent = data.word;
      verseArabic.textContent = data.verse;
      verseTrans.textContent = data.trans;
      verseRef.textContent = data.ref;

      // Animate In
      wordElem.className = 'main-word ink-draw-in';
      dividerElem.classList.add('show');
      verseBox.classList.add('show');

      // Set timeout for next transition
      cycleTimer = setTimeout(() => {
        // Animate Out
        wordElem.className = 'main-word ink-fade-out';
        dividerElem.classList.remove('show');
        verseBox.classList.remove('show');

        setTimeout(() => {
          currentIndex = (currentIndex + 1) % spiritualList.length;
          showItem(currentIndex);
        }, transitionDuration);

      }, displayDuration);
    }

    function restartCycle() {
      clearTimeout(cycleTimer);
      showItem(currentIndex);
    }



    // Start
    updateTimingVariables();
    showItem(currentIndex);
  </script>
</body>
</html>
